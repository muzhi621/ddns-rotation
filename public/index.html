<head data-page-node-id="S6UEgVWWlGm0NqU9nMXMUB">

<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --text:#1f2430; --muted:#6b7280; --primary:#2f6fed; --ok:#0f9960; --warn:#c47f17; --err:#d64545; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }

  input, select, button { font:inherit; }

  input:focus, select:focus { outline:none; border-color:var(--primary); }
  .btn { padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; }
  .btn:hover { border-color:var(--primary); color:var(--primary); }
  .btn.primary { background:var(--primary); color:#fff; border-color:var(--primary); }
  .btn.primary:hover { opacity:.9; color:#fff; }
  .btn.danger { color:var(--err); }
  .btn.sm { padding:3px 8px; font-size:12px; }
  .btn:disabled { opacity:.55; cursor:not-allowed; }

  nav button.on { background:#fff; color:var(--text); font-weight:600; box-shadow:0 -1px 0 var(--line) inset; }
  main { padding:16px 20px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; overflow-x:auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .muted { color:var(--muted); }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef2ff; color:#33408f; white-space:nowrap; }
  .tag.ok { background:#e6f6ee; color:var(--ok); }
  .tag.warn { background:#fdf3e2; color:var(--warn); }
  .tag.err { background:#fdecec; color:var(--err); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; align-items:baseline; }
  .modal { position:fixed; inset:0; background:rgba(15,20,30,.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-box { background:#fff; border-radius:12px; padding:18px; width:min(560px,100%); max-height:86vh; overflow:auto; }
  .modal-box h3 { margin:0 0 12px; font-size:15px; }
  .fld { margin-bottom:10px; }
  .fld label { display:block; font-size:12px; color:var(--muted); margin-bottom:3px; }
  .fld input, .fld select { width:100%; }
  .fld .hint { font-size:11px; color:var(--muted); margin-top:2px; }
  .toast { position:fixed; right:18px; bottom:18px; background:#1f2430; color:#fff; padding:10px 14px; border-radius:8px; z-index:99; max-width:80vw; }
  code { background:#f0f2f5; padding:1px 5px; border-radius:4px; }
  /* 登录页 */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(135deg,#2f6fed 0%,#1e4bb8 100%); }
  .login-card { background:#fff; border-radius:16px; padding:36px 32px; width:min(380px,100%); box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .login-card .logo { text-align:center; margin-bottom:8px; }
  .login-card h1 { font-size:20px; margin:0 0 4px; text-align:center; font-weight:700; }
  .login-card .sub { color:var(--muted); text-align:center; font-size:13px; margin-bottom:24px; }
  .login-card label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  .login-card input { width:100%; padding:10px 12px; font-size:15px; }
  .login-card .btn { width:100%; padding:10px; margin-top:16px; font-size:15px; }
  .login-err { color:var(--err); font-size:12px; margin-top:10px; min-height:16px; text-align:center; }
  #shell { display:none; }
  #shell.on { display:block; }
  @media (max-width:640px){ header{padding:10px 12px} nav,main{padding-left:12px;padding-right:12px} .kv{grid-template-columns:96px 1fr} }

<body data-page-node-id="cCV3sBMK9F0LR70PfCrmA1">
<!-- 登录页：进入系统前先鉴权 -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="logo">🌐</div>
    <h1>多机轮换解析调度器</h1>
    <div class="sub">请输入管理密码进入系统</div>
    <label for="login-token">管理密码（ADMIN_TOKEN）</label>
    <input type="password" id="login-token" placeholder="部署时设置的密码" autocomplete="current-password" />
    <button class="btn primary" id="btn-login">登 录</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="shell">
<header data-page-node-id="ninCRFxmt8912vWyfuYGj3">
  <h1 data-page-node-id="8BRCoOXdFlUxnoECdc7mMc">多机轮换解析调度器</h1>
  <span class="muted" id="status" data-page-node-id="z6KRrx50t8dGILAqrLAB16"></span>
  <div class="spacer" data-page-node-id="2L6eKu5plGECi5m98Hgsw5"></div>
  <button class="btn" id="btn-logout" data-page-node-id="vLk9pQwXs8TqR2NcYfB4d">退出登录</button>
  <button class="btn primary" id="btn-sync" data-page-node-id="g8JEMT53gyA4wBEwFlLFf6">立即同步</button>
  <button class="btn" id="btn-force" data-page-node-id="uBf3OaTxpFmpHjjPjWwKTd">强制同步</button>
  <button class="btn" id="btn-reload" data-page-node-id="EVY9jEGh6BMn2SLkVpsHQU">刷新</button>
</header>

<nav id="tabs" data-page-node-id="tu9ZCh4d1AcLTrDB7ALdXV"></nav>
<main id="app" data-page-node-id="m4p3ykv0gR5Gg2oxmZ666t"></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const TABS = [
  ['overview', '概览'], ['machines', '机器'], ['groups', '分组排班'],
  ['domains', '解析记录'], ['creds', 'DNS 凭据'], ['logs', '日志'],
];
const MODE_LABELS = { window: '按在线时段', rotate: '按天轮转', static: '固定首台' };
const LEVEL_LABELS = { info: '信息', warn: '警告', error: '错误' };
let TOKEN = localStorage.getItem('dr_token') || '';
let TAB = 'overview';
let DATA = null, META = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const modeLabel = (m) => MODE_LABELS[m] || m;
const levelLabel = (l) => LEVEL_LABELS[l] || l;
const fullDomain = (r) => (r.record_name === '@' ? r.domain : r.record_name + '.' + r.domain);
// SQLite datetime('now') 存的是 UTC，补 Z 转本地时区显示
function fmtTime(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  return isNaN(d) ? esc(s) : d.toLocaleString('zh-CN', { hour12: false });
}
function fmtIn(mins) {
  const m = Math.max(0, Number(mins) || 0);
  return m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60} 分` : `${m} 分钟`;
}
function safeJson(s) { try { return JSON.parse(s || '{}'); } catch { return {}; } }

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.background = bad ? '#d64545' : '#1f2430';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function load() {
  try {
    const [ov, meta] = await Promise.all([api('/api/overview'), api('/api/meta')]);
    DATA = ov; META = meta;
    $('#status').textContent = '已连接 · ' + new Date(ov.now).toLocaleString('zh-CN', { hour12: false });
    render();
  } catch (e) {
    // 401 说明令牌无效/过期，回到登录页
    if (e.message.includes('401') || e.message.includes('未授权')) {
      logout(false);
      return;
    }
    $('#status').textContent = '连接失败：' + e.message;
    if (!DATA) { // 兜底渲染骨架
      DATA = { groups: [], machines: [], credentials: [], logs: [] };
      META = {
        providers: [],
        modes: Object.entries(MODE_LABELS).map(([key, label]) => ({ key, label })),
        timezones: ['Asia/Shanghai'],
      };
      render();
    }
  }
}

/* ---------- 登录态 ---------- */
function showLogin(err) {
  $('#login').style.display = 'flex';
  $('#shell').classList.remove('on');
  $('#login-err').textContent = err || '';
  if (!err) $('#login-token').value = '';
  setTimeout(() => $('#login-token').focus(), 0);
}
function showApp() {
  $('#login').style.display = 'none';
  $('#shell').classList.add('on');
}
async function doLogin() {
  const v = $('#login-token').value.trim();
  if (!v) { $('#login-err').textContent = '请输入管理密码'; return; }
  const btn = $('#btn-login');
  btn.disabled = true; btn.textContent = '验证中…';
  TOKEN = v;
  try {
    // 用 overview 验证令牌是否有效
    await api('/api/overview');
    localStorage.setItem('dr_token', TOKEN);
    showApp();
    await load();
  } catch (e) {
    TOKEN = '';
    $('#login-err').textContent = '密码错误或服务不可用：' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}
function logout(clear) {
  if (clear) localStorage.removeItem('dr_token');
  TOKEN = '';
  showLogin();
}

/* ---------- 通用表单弹窗（支持按条件显隐字段、Esc 关闭） ---------- */
function modal(title, fields, values = {}) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${esc(title)}</h3>${fields.map((f) => `
      <div class="fld">
        <label>${esc(f.label)}</label>
        ${f.type === 'select'
          ? `<select data-k="${f.key}">${(f.options || []).map((o) => `<option value="${esc(o.value ?? o)}" ${String(values[f.key] ?? '') === String(o.value ?? o) ? 'selected' : ''}>${esc(o.label ?? o)}</option>`).join('')}</select>`
          : f.type === 'checkbox'
            ? `<input type="checkbox" data-k="${f.key}" ${values[f.key] ? 'checked' : ''} />`
            : `<input type="${f.type || 'text'}" data-k="${f.key}" value="${esc(values[f.key] ?? '')}" placeholder="${esc(f.placeholder || '')}" />`}
        ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
      </div>`).join('')}
      <div class="row" style="justify-content:flex-end">
        <button class="btn" data-act="cancel">取消</button>
        <button class="btn primary" data-act="ok">保存</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const close = () => { wrap.remove(); resolve(null); };
    const getVal = () => {
      const v = {};
      fields.forEach((f) => {
        const el = wrap.querySelector(`[data-k="${f.key}"]`);
        v[f.key] = f.type === 'checkbox' ? el.checked : (f.type === 'number' ? Number(el.value) : el.value);
      });
      return v;
    };
    const applyShow = () => {
      const v = getVal();
      fields.forEach((f) => {
        const box = wrap.querySelector(`[data-k="${f.key}"]`)?.closest('.fld');
        if (box) box.style.display = (!f.showIf || f.showIf(v)) ? '' : 'none';
      });
    };
    applyShow();
    fields.forEach((f) => {
      const el = wrap.querySelector(`[data-k="${f.key}"]`);
      if (el && f.showIf) el.addEventListener('change', applyShow);
    });
    const onKey = (e) => { if (e.key === 'Escape') { cleanup(); close(); } };
    const cleanup = () => document.removeEventListener('keydown', onKey);
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) { cleanup(); close(); } });
    wrap.querySelector('[data-act=cancel]').onclick = () => { cleanup(); close(); };
    wrap.querySelector('[data-act=ok]').onclick = () => { cleanup(); wrap.remove(); resolve(getVal()); };
  });
}

async function guard(fn, btn) {
  let t;
  if (btn) { btn.disabled = true; t = btn.textContent; btn.textContent = '处理中…'; }
  try { await fn(); await load(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) { btn.disabled = false; btn.textContent = t; } }
}

/* ---------- 渲染 ---------- */
function render() {
  $('#tabs').innerHTML = TABS.map(([k, label]) => `<button class="${k === TAB ? 'on' : ''}" data-tab="${k}">${label}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach((b) => (b.onclick = () => { TAB = b.dataset.tab; render(); }));
  $('#app').innerHTML = { overview: viewOverview, machines: viewMachines, groups: viewGroups, domains: viewDomains, creds: viewCreds, logs: viewLogs }[TAB]();
  bind();
}

function bind() {
  document.querySelectorAll('[data-act]').forEach((el) => {
    const act = el.dataset.act;
    if (handlers[act]) el.onclick = () => handlers[act](el.dataset.id, el);
  });
}

function viewOverview() {
  if (!DATA.groups.length) return `<div class="card">还没有分组。建议流程：<b>① 机器</b> 录入服务器 → <b>② DNS 凭据</b> 填厂商密钥 → <b>③ 分组排班</b> 建分组并绑定域名。</div>`;
  return `<div class="grid">` + DATA.groups.map((g) => `
    <div class="card">
      <div class="row"><strong>${esc(g.name)}</strong> <span class="tag">${modeLabel(g.mode)}</span>
        ${g.enabled ? '' : '<span class="tag warn">已停用</span>'}</div>
      <div class="kv" style="margin-top:8px">
        <span class="muted">当前指向</span><span>${g.target.ip ? `<strong>${esc(g.target.name || '兜底 IP')}</strong> · <code>${esc(g.target.ip)}</code>` : '<span class="tag err">无可用 IP</span>'}</span>
        <span class="muted">判定依据</span><span>${esc(g.target.reason)}</span>
        <span class="muted">在线机器</span><span>${g.online.length ? esc(g.online.join('、')) : '—'}</span>
        <span class="muted">下次变化</span><span>${g.next ? `${esc(g.next.kind)} · ${fmtIn(g.next.inMinutes)}后（${fmtTime(g.next.at)}）` : '—'}</span>
        <span class="muted">时区 / 切换</span><span>${esc(g.timezone)}${g.mode === 'rotate' ? ' · 每日 ' + esc(g.switch_time) : ''}</span>
      </div>
      <table style="margin-top:10px">
        ${g.records.map((r) => `<tr>
          <td>${esc(fullDomain(r))}</td>
          <td class="muted">${esc(r.provider)}${r.enabled ? '' : ' <span class="tag warn">停用</span>'}</td>
          <td>${r.current ? `<code>${esc(r.current)}</code>` : '<span class="muted">未同步</span>'}</td>
          <td>${r.current && r.current === g.target.ip ? '<span class="tag ok">一致</span>' : '<span class="tag warn">待同步</span>'}</td>
        </tr>`).join('') || '<tr><td class="muted">该分组还没有解析记录</td></tr>'}
      </table>
      <div class="row" style="margin-top:10px">
        <button class="btn sm primary" data-act="sync-group" data-id="${g.id}">同步本组</button>
        <button class="btn sm" data-act="edit-group" data-id="${g.id}">编辑</button>
        <button class="btn sm" data-act="edit-members" data-id="${g.id}">排班/成员</button>
        <button class="btn sm" data-act="preview-group" data-id="${g.id}">7 天预览</button>
        <button class="btn sm" data-act="add-domain" data-id="${g.id}">+ 解析记录</button>
      </div>
    </div>`).join('') + `</div>`;
}

function viewMachines() {
  return `<div class="card">
    <div class="row" style="margin-bottom:8px"><strong>机器列表</strong><div class="spacer"></div>
    <button class="btn primary sm" data-act="add-machine">+ 新增机器</button></div>
    <table><tr><th>名称</th><th>公网 IP</th><th>备注</th><th>状态</th><th></th></tr>
    ${DATA.machines.map((m) => `<tr>
      <td>${esc(m.name)}</td><td><code>${esc(m.ip || '—')}</code></td><td class="muted">${esc(m.note)}</td>
      <td>${m.enabled ? '<span class="tag ok">启用</span>' : '<span class="tag">停用</span>'}</td>
      <td class="row"><button class="btn sm" data-act="edit-machine" data-id="${m.id}">编辑</button>
      <button class="btn sm danger" data-act="del-machine" data-id="${m.id}">删除</button></td></tr>`).join('') || '<tr><td class="muted">还没有机器，点右上角「新增机器」开始</td></tr>'}
    </table>
    <div class="hint muted" style="margin-top:8px">机器开关机由你在云厂商控制台/定时脚本控制，这里只需填 IP 与排班时段。</div>
  </div>`;
}

function viewGroups() {
  return `<div class="card">
    <div class="row" style="margin-bottom:8px"><strong>分组</strong><div class="spacer"></div>
    <button class="btn primary sm" data-act="add-group">+ 新增分组</button></div>
    <table><tr><th>分组</th><th>模式</th><th>机器</th><th>域名记录</th><th>兜底 IP</th><th></th></tr>
    ${DATA.groups.map((g) => `<tr>
      <td><strong>${esc(g.name)}</strong><div class="muted" style="font-size:12px">${esc(g.timezone)}${g.mode === 'rotate' ? ' · 每日 ' + esc(g.switch_time) + ' 切换' : ''}</div></td>
      <td><span class="tag">${modeLabel(g.mode)}</span></td>
      <td>${g.members.map((m) => `${esc(m.name)}${g.mode === 'window' ? ` (${esc(m.window_start)}-${esc(m.window_end)})` : ''}`).join('<br>') || '<span class="muted">未添加</span>'}</td>
      <td>${g.records.map((r) => esc(fullDomain(r))).join('<br>') || '<span class="muted">未添加</span>'}</td>
      <td><code>${esc(g.fallback_ip || '—')}</code></td>
      <td class="row"><button class="btn sm" data-act="edit-group" data-id="${g.id}">编辑</button>
      <button class="btn sm" data-act="edit-members" data-id="${g.id}">排班</button>
      <button class="btn sm" data-act="preview-group" data-id="${g.id}">7 天预览</button>
      <button class="btn sm danger" data-act="del-group" data-id="${g.id}">删除</button></td></tr>`).join('') || '<tr><td class="muted">还没有分组</td></tr>'}
    </table></div>`;
}

function viewDomains() {
  const rows = DATA.groups.flatMap((g) => g.records.map((r) => ({ ...r, gname: g.name })));
  return `<div class="card">
    <div class="row" style="margin-bottom:8px"><strong>解析记录</strong><div class="spacer"></div>
    <button class="btn primary sm" data-act="add-domain">+ 新增记录</button></div>
    <table><tr><th>分组</th><th>域名 / 主机记录</th><th>厂商</th><th>凭据</th><th>TTL</th><th>当前值</th><th></th></tr>
    ${rows.map((r) => `<tr>
      <td>${esc(r.gname)}</td>
      <td><code>${esc(fullDomain(r))}</code>${r.proxied ? ' <span class="tag">橙云代理</span>' : ''}</td>
      <td>${esc(r.provider)}</td>
      <td>${r.cred_name ? esc(r.cred_name) : '<span class="tag warn">未绑定凭据</span>'}</td>
      <td>${esc(r.ttl)}</td>
      <td>${r.current ? `<code>${esc(r.current)}</code>` : '<span class="muted">—</span>'}</td>
      <td class="row"><button class="btn sm" data-act="edit-domain" data-id="${r.id}">编辑</button>
      <button class="btn sm danger" data-act="del-domain" data-id="${r.id}">删除</button></td></tr>`).join('') || '<tr><td class="muted">还没有解析记录</td></tr>'}
    </table></div>`;
}

function viewCreds() {
  return `<div class="card">
    <div class="row" style="margin-bottom:8px"><strong>DNS 凭据</strong><div class="spacer"></div>
    <button class="btn primary sm" data-act="add-cred">+ 新增凭据</button></div>
    <table><tr><th>名称</th><th>厂商</th><th>已填字段</th><th></th></tr>
    ${DATA.credentials.map((c) => `<tr>
      <td>${esc(c.name)}</td><td>${esc((META.providers || []).find((p) => p.key === c.provider)?.label || c.provider)}</td>
      <td class="muted">${esc(Object.keys(safeJson(c.config)).join('、'))}</td>
      <td class="row"><button class="btn sm" data-act="edit-cred" data-id="${c.id}">编辑</button>
      <button class="btn sm" data-act="test-cred" data-id="${c.id}">连通测试</button>
      <button class="btn sm danger" data-act="del-cred" data-id="${c.id}">删除</button></td></tr>`).join('') || '<tr><td class="muted">还没有凭据。凭据 = 各 DNS 厂商的 API 密钥，可被多条解析记录复用</td></tr>'}
    </table></div>`;
}

function viewLogs() {
  return `<div class="card">
    <div class="row" style="margin-bottom:8px"><strong>最近日志</strong><div class="spacer"></div>
    <button class="btn sm danger" data-act="clear-logs">清空</button></div>
    <table><tr><th style="width:150px">时间</th><th style="width:70px">级别</th><th>内容</th></tr>
    ${DATA.logs.map((l) => `<tr><td class="muted">${fmtTime(l.ts)}</td>
      <td><span class="tag ${l.level === 'error' ? 'err' : l.level === 'warn' ? 'warn' : 'ok'}">${levelLabel(l.level)}</span></td>
      <td>${esc(l.message)}</td></tr>`).join('') || '<tr><td class="muted">暂无日志</td></tr>'}
    </table></div>`;
}

/* ---------- DNS 凭据：一步式弹窗（选厂商即切换字段） ---------- */
function credModal(existing) {
  return new Promise((resolve) => {
    const providers = META.providers || [];
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${existing ? '编辑凭据' : '新增 DNS 凭据'}</h3>
      ${providers.length ? '' : '<div class="tag warn" style="margin-bottom:10px">厂商列表加载失败，请刷新页面后重试</div>'}
      <div class="fld"><label>凭据名称</label>
        <input data-k="name" value="${esc(existing?.name || '')}" placeholder="如 CF-主账号 / 阿里云-解析专用" /></div>
      <div class="fld"><label>DNS 厂商</label>
        <select data-k="provider">${providers.map((p) => `<option value="${esc(p.key)}" ${existing?.provider === p.key ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}</select></div>
      <div id="cred-fields"></div>
      <div class="row" style="justify-content:flex-end;margin-top:6px">
        <button class="btn" data-a="cancel">取消</button>
        <button class="btn primary" data-a="ok">保存</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const close = (v) => { wrap.remove(); resolve(v); };

    const renderFields = () => {
      const key = wrap.querySelector('[data-k=provider]').value;
      const p = providers.find((x) => x.key === key);
      const cfg = existing ? safeJson(existing.config) : {};
      const fs = p?.fields || [];
      wrap.querySelector('#cred-fields').innerHTML = (fs.length ? fs.map((f) => `
        <div class="fld"><label>${esc(f.label)}</label>
          <input type="${f.secret ? 'password' : 'text'}" data-f="${esc(f.key)}" value="${esc(cfg[f.key] || '')}" autocomplete="off" />
          ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`).join('')
        : '<div class="muted" style="font-size:12px">该厂商无需密钥（演练模式：只计算排班、写日志，不下发解析）。</div>');
    };
    renderFields();
    wrap.querySelector('[data-k=provider]').onchange = renderFields;
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(null); });
    wrap.querySelector('[data-a=cancel]').onclick = () => close(null);
    wrap.querySelector('[data-a=ok]').onclick = () => {
      const name = wrap.querySelector('[data-k=name]').value.trim();
      const provider = wrap.querySelector('[data-k=provider]').value;
      if (!name) return toast('请填写凭据名称', true);
      if (!provider) return toast('请选择 DNS 厂商', true);
      const config = {};
      wrap.querySelectorAll('[data-f]').forEach((el) => { config[el.dataset.f] = el.value.trim(); });
      close({ name, provider, config });
    };
  });
}

/* ---------- 操作 ---------- */
const handlers = {
  'add-machine': () => guard(async () => {
    const v = await modal('新增机器', [
      { key: 'name', label: '名称', placeholder: '如 HK-01' },
      { key: 'ip', label: '公网 IP', placeholder: '1.2.3.4', hint: 'IPv4 格式；建议使用固定 IP / 弹性 IP' },
      { key: 'note', label: '备注（可选）' },
      { key: 'enabled', label: '启用', type: 'checkbox' },
    ], { enabled: true });
    if (v) await api('/api/machines', { method: 'POST', body: v });
  }),
  'edit-machine': (id) => guard(async () => {
    const m = DATA.machines.find((x) => String(x.id) === String(id));
    const v = await modal('编辑机器', [
      { key: 'name', label: '名称' }, { key: 'ip', label: '公网 IP' }, { key: 'note', label: '备注' },
      { key: 'enabled', label: '启用', type: 'checkbox' },
    ], { ...m, enabled: !!m.enabled });
    if (v) await api('/api/machines/' + id, { method: 'PUT', body: v });
  }),
  'del-machine': (id) => guard(async () => { if (confirm('删除该机器？其在全部分组中的排班也会一并移除。')) await api('/api/machines/' + id, { method: 'DELETE' }); }),

  'add-group': () => guard(async () => {
    const v = await modal('新增分组', groupFields(), { mode: 'window', timezone: 'Asia/Shanghai', switch_time: '03:00', anchor_date: '1970-01-01', enabled: true });
    if (v) await api('/api/groups', { method: 'POST', body: v });
    if (v) toast('分组已创建。下一步：点「排班」勾选成员，再添加解析记录。');
  }),
  'edit-group': (id) => guard(async () => {
    const g = DATA.groups.find((x) => String(x.id) === String(id));
    const v = await modal('编辑分组', groupFields(), { ...g, enabled: !!g.enabled });
    if (v) await api('/api/groups/' + id, { method: 'PUT', body: v });
  }),
  'del-group': (id) => guard(async () => { if (confirm('删除该分组？其下解析记录与排班将一并删除。')) await api('/api/groups/' + id, { method: 'DELETE' }); }),

  'edit-members': (id) => guard(async () => {
    const g = DATA.groups.find((x) => String(x.id) === String(id));
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${esc(g.name)} · 排班与成员</h3>
      <div class="hint muted" style="margin-bottom:8px">${g.mode === 'rotate'
        ? '按天轮转：勾选的机器按列表顺序每天轮流值班，时段可忽略。'
        : '按在线时段：勾选机器并填写在线时段（与云厂商设置的开机时间一致），支持跨天如 22:00 → 06:00。'}</div>
      <table><tr><th>加入</th><th>机器</th><th>在线开始</th><th>在线结束</th></tr>
      ${DATA.machines.map((m) => {
        const cur = g.members.find((x) => String(x.machine_id) === String(m.id));
        return `<tr><td><input type="checkbox" data-mid="${m.id}" ${cur ? 'checked' : ''} /></td>
          <td>${esc(m.name)} <span class="muted">${esc(m.ip)}</span></td>
          <td><input type="text" data-start="${m.id}" value="${esc(cur?.window_start || '00:00')}" style="width:80px" placeholder="08:00" /></td>
          <td><input type="text" data-end="${m.id}" value="${esc(cur?.window_end || '23:59')}" style="width:80px" placeholder="20:00" /></td></tr>`;
      }).join('')}</table>
      ${DATA.machines.length ? '' : '<div class="muted" style="margin:8px 0">还没有机器，请先到「机器」页新增。</div>'}
      <div class="row" style="justify-content:flex-end;margin-top:12px">
        <button class="btn" data-act2="cancel">取消</button><button class="btn primary" data-act2="ok">保存</button></div></div>`;
    document.body.appendChild(wrap);
    const close = () => wrap.remove();
    wrap.querySelector('[data-act2=cancel]').onclick = close;
    wrap.querySelector('[data-act2=ok]').onclick = async () => {
      const items = [];
      DATA.machines.forEach((m) => {
        if (wrap.querySelector(`[data-mid="${m.id}"]`).checked) {
          items.push({
            machine_id: m.id,
            window_start: wrap.querySelector(`[data-start="${m.id}"]`).value || '00:00',
            window_end: wrap.querySelector(`[data-end="${m.id}"]`).value || '23:59',
            enabled: 1,
          });
        }
      });
      close();
      await guard(async () => api(`/api/groups/${id}/members`, { method: 'PUT', body: { items } }));
    };
  }),

  'preview-group': (id) => guard(async () => {
    const r = await api('/api/preview?group_id=' + id);
    const p = (r.preview || [])[0];
    if (!p) return toast('预览失败：分组不存在', true);
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${esc(p.group)} · 未来 7 天排班预览</h3>
      <div class="hint muted" style="margin-bottom:8px">模式：${esc(MODE_LABELS[p.mode] || p.mode || '')} · 时区 ${esc(p.timezone)}</div>
      <table><tr><th>日期</th><th>值班机器</th><th>解析 IP</th><th>判定依据</th></tr>
      ${p.plan.map((d) => `<tr><td>${esc(d.date)}</td>
        <td>${d.machine ? `<strong>${esc(d.machine)}</strong>` : '<span class="tag warn">无</span>'}</td>
        <td><code>${esc(d.ip || '—')}</code></td>
        <td class="muted">${esc(d.reason)}</td></tr>`).join('')}</table>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act2="close">关闭</button></div></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('[data-act2=close]').onclick = () => wrap.remove();
    wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  }),

  'add-domain': (id) => guard(async () => {
    if (!DATA.groups.length) return toast('请先创建分组', true);
    const v = await modal('新增解析记录', domainFields(), { group_id: id || '', record_name: '@', record_type: 'A', ttl: 600, enabled: true, proxied: false });
    if (v) await api('/api/domains', { method: 'POST', body: v });
  }),
  'edit-domain': (id) => guard(async () => {
    const r = DATA.groups.flatMap((g) => g.records).find((x) => String(x.id) === String(id));
    const v = await modal('编辑解析记录', domainFields(), { ...r, enabled: !!r.enabled, proxied: !!r.proxied });
    if (v) await api('/api/domains/' + id, { method: 'PUT', body: v });
  }),
  'del-domain': (id) => guard(async () => { if (confirm('删除该解析记录？')) await api('/api/domains/' + id, { method: 'DELETE' }); }),

  'add-cred': () => guard(async () => {
    const v = await credModal(null);
    if (v) await api('/api/credentials', { method: 'POST', body: v });
  }),
  'edit-cred': (id) => guard(async () => {
    const c = (await api('/api/credentials')).credentials.find((x) => String(x.id) === String(id));
    if (!c) return;
    const v = await credModal(c);
    if (v) await api('/api/credentials/' + id, { method: 'PUT', body: v });
  }),
  'del-cred': (id) => guard(async () => { if (confirm('删除该凭据？（被解析记录引用时会被拒绝）')) await api('/api/credentials/' + id, { method: 'DELETE' }); }),
  'test-cred': (id) => guard(async () => {
    const v = await modal('凭据连通测试', [
      { key: 'domain', label: '域名', placeholder: 'example.com', hint: '用该凭据查询这条记录的当前解析值，验证密钥是否可用' },
      { key: 'record_name', label: '主机记录', placeholder: '@' },
      { key: 'zone_id', label: 'Zone ID（仅 Cloudflare，可选）' },
    ], { record_name: '@' });
    if (!v) return;
    const r = await api('/api/credentials/' + id + '/test', { method: 'POST', body: v });
    toast('✓ 密钥可用：' + (r.recordId ? '记录已存在，' : '记录尚未创建，') + '当前值=' + (r.content || '空'));
  }),

  'sync-group': (id, el) => guard(async () => {
    const r = await api('/api/sync', { method: 'POST', body: { group_id: Number(id), force: true } });
    const msg = (r.results?.[0]?.results || []).map((x) => x.domain + '：' + x.message).join('；');
    toast(msg || '完成');
  }, el),

  'clear-logs': () => guard(async () => { if (confirm('清空全部日志？')) await api('/api/logs/clear', { method: 'POST' }); }),
};

function groupFields() {
  return [
    { key: 'name', label: '分组名称', placeholder: '如 游戏服-A组' },
    { key: 'mode', label: '排班模式', type: 'select', options: (META.modes || []).map((m) => ({ value: m.key, label: m.label || m.key })) },
    { key: 'timezone', label: '时区', type: 'select', options: META.timezones },
    { key: 'switch_time', label: '每日切换时刻', placeholder: '03:00', hint: '切换时刻之前仍沿用前一天的值班机器', showIf: (v) => v.mode === 'rotate' },
    { key: 'anchor_date', label: '轮转基准日', placeholder: '1970-01-01', hint: '轮换从该日起算（1970-01-01 表示从组内第 1 台开始），一般不用改', showIf: (v) => v.mode === 'rotate' },
    { key: 'fallback_ip', label: '兜底 IP（可选）', placeholder: '所有机器都不在线时解析到这里', hint: '留空则无机器在线时保持上一次解析不变' },
    { key: 'enabled', label: '启用', type: 'checkbox' },
  ];
}

function domainFields() {
  const credOpts = DATA.credentials.map((c) => ({ value: c.id, label: c.name + '（' + c.provider + '）' }));
  if (!credOpts.length) credOpts.unshift({ value: '', label: '（还没有凭据，请先到「DNS 凭据」新建）' });
  return [
    { key: 'group_id', label: '所属分组', type: 'select', options: DATA.groups.map((g) => ({ value: g.id, label: g.name })) },
    { key: 'provider', label: 'DNS 厂商', type: 'select', options: (META.providers || []).map((p) => ({ value: p.key, label: p.label })) },
    { key: 'credential_id', label: '使用的凭据', type: 'select', options: credOpts, hint: DATA.credentials.length ? '' : '需要先在「DNS 凭据」页新建一条凭据' },
    { key: 'domain', label: '域名', placeholder: 'example.com' },
    { key: 'record_name', label: '主机记录', placeholder: '@ 或 www', hint: '@ 表示根域名本身' },
    { key: 'ttl', label: 'TTL（秒）', type: 'number', hint: '越小生效越快；建议 60~600。Cloudflare 橙云代理时固定为 auto' },
    { key: 'proxied', label: 'Cloudflare 橙云代理（仅 Cloudflare 厂商）', type: 'checkbox' },
    { key: 'record_id', label: '记录 ID（可选）', hint: '留空自动查询并回填' },
    { key: 'zone_id', label: 'Zone ID（仅 Cloudflare，可选）', hint: '留空自动查询并回填' },
    { key: 'enabled', label: '启用', type: 'checkbox' },
  ];
}

$('#btn-login').onclick = doLogin;
$('#login-token').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('#btn-logout').onclick = () => logout(true);
$('#btn-reload').onclick = load;
$('#btn-sync').onclick = (e) => guard(async () => {
  const r = await api('/api/sync', { method: 'POST', body: {} });
  toast('同步完成，共 ' + r.results.length + ' 个分组');
}, e.currentTarget);
$('#btn-force').onclick = (e) => guard(async () => {
  await api('/api/sync', { method: 'POST', body: { force: true } });
  toast('已强制重新下发全部解析');
}, e.currentTarget);

// 启动：有令牌则尝试直接进入，否则显示登录页
(function init() {
  if (TOKEN) {
    doLogin();
  } else {
    showLogin();
  }
})();
</script>
