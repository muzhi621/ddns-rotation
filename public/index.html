<script>
const $ = (s) => document.querySelector(s);
const TABS = [
  ['overview', '概览'], ['machines', '机器'], ['groups', '分组排班'],
  ['domains', '解析记录'], ['creds', 'DNS 凭据'], ['logs', '日志'],
];
const MODE_LABELS = { window: '按在线时段', rotate: '按天轮转', static: '固定首台' };
const LEVEL_LABELS = { info: '信息', warn: '警告', error: '错误' };
let TOKEN = localStorage.getItem('dr_token') || '';
let TAB = 'overview';
let DATA = null, META = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const modeLabel = (m) => MODE_LABELS[m] || m;
const levelLabel = (l) => LEVEL_LABELS[l] || l;
const fullDomain = (r) => (r.record_name === '@' ? r.domain : r.record_name + '.' + r.domain);
// SQLite datetime('now') 存的是 UTC，补 Z 转本地时区显示
function fmtTime(s) {
  if (!s) return '—';
  const d = new Date(s.includes('T') ? s : s.replace(' ', 'T') + 'Z');
  return isNaN(d) ? esc(s) : d.toLocaleString('zh-CN', { hour12: false });
}
function fmtIn(mins) {
  const m = Math.max(0, Number(mins) || 0);
  return m >= 60 ? `${Math.floor(m / 60)} 小时 ${m % 60} 分` : `${m} 分钟`;
}
function safeJson(s) { try { return JSON.parse(s || '{}'); } catch { return {}; } }

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}), ...(opts.headers || {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function load() {
  try {
    const [ov, meta] = await Promise.all([api('/api/overview'), api('/api/meta')]);
    DATA = ov; META = meta;
    $('#status').textContent = '已连接 · ' + new Date(ov.now).toLocaleString('zh-CN', { hour12: false });
    $('#status-dot').className = 'dot on';
    render();
  } catch (e) {
    // 401 说明令牌无效/过期，回到登录页
    if (e.message.includes('401') || e.message.includes('未授权')) {
      logout(false);
      return;
    }
    $('#status').textContent = '连接失败：' + e.message;
    $('#status-dot').className = 'dot off';
    if (!DATA) { // 兜底渲染骨架
      DATA = { groups: [], machines: [], credentials: [], logs: [] };
      META = {
        providers: [],
        modes: Object.entries(MODE_LABELS).map(([key, label]) => ({ key, label })),
        timezones: ['Asia/Shanghai'],
      };
      render();
    }
  }
}

/* ---------- 登录态 ---------- */
function showLogin(err) {
  $('#login').style.display = 'flex';
  $('#shell').classList.remove('on');
  $('#login-err').textContent = err || '';
  if (!err) $('#login-token').value = '';
  setTimeout(() => $('#login-token').focus(), 0);
}
function showApp() {
  $('#login').style.display = 'none';
  $('#shell').classList.add('on');
}
async function doLogin() {
  const v = $('#login-token').value.trim();
  if (!v) { $('#login-err').textContent = '请输入管理密码'; return; }
  const btn = $('#btn-login');
  btn.disabled = true; btn.textContent = '验证中…';
  TOKEN = v;
  try {
    // 用 overview 验证令牌是否有效
    await api('/api/overview');
    localStorage.setItem('dr_token', TOKEN);
    showApp();
    await load();
  } catch (e) {
    TOKEN = '';
    $('#login-err').textContent = '密码错误或服务不可用：' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '登 录';
  }
}
function logout(clear) {
  if (clear) localStorage.removeItem('dr_token');
  TOKEN = '';
  showLogin();
}

/* ---------- 通用表单弹窗（支持按条件显隐字段、Esc 关闭） ---------- */
function modal(title, fields, values = {}) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${esc(title)}</h3>${fields.map((f) => `
      <div class="fld">
        <label>${esc(f.label)}</label>
        ${f.type === 'select'
          ? `<select data-k="${f.key}">${(f.options || []).map((o) => `<option value="${esc(o.value ?? o)}" ${String(values[f.key] ?? '') === String(o.value ?? o) ? 'selected' : ''}>${esc(o.label ?? o)}</option>`).join('')}</select>`
          : f.type === 'checkbox'
            ? `<input type="checkbox" data-k="${f.key}" ${values[f.key] ? 'checked' : ''} />`
            : `<input type="${f.type || 'text'}" data-k="${f.key}" value="${esc(values[f.key] ?? '')}" placeholder="${esc(f.placeholder || '')}" />`}
        ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}
      </div>`).join('')}
      <div class="row" style="justify-content:flex-end">
        <button class="btn" data-act="cancel">取消</button>
        <button class="btn primary" data-act="ok">保存</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const close = () => { wrap.remove(); resolve(null); };
    const getVal = () => {
      const v = {};
      fields.forEach((f) => {
        const el = wrap.querySelector(`[data-k="${f.key}"]`);
        v[f.key] = f.type === 'checkbox' ? el.checked : (f.type === 'number' ? Number(el.value) : el.value);
      });
      return v;
    };
    const applyShow = () => {
      const v = getVal();
      fields.forEach((f) => {
        const box = wrap.querySelector(`[data-k="${f.key}"]`)?.closest('.fld');
        if (box) box.style.display = (!f.showIf || f.showIf(v)) ? '' : 'none';
      });
    };
    applyShow();
    fields.forEach((f) => {
      const el = wrap.querySelector(`[data-k="${f.key}"]`);
      if (!el) return;
      if (f.showIf) el.addEventListener('change', applyShow);
      if (f.onChange) el.addEventListener('change', () => f.onChange(getVal(), wrap));
    });
    const onKey = (e) => { if (e.key === 'Escape') { cleanup(); close(); } };
    const cleanup = () => document.removeEventListener('keydown', onKey);
    document.addEventListener('keydown', onKey);
    wrap.addEventListener('click', (e) => { if (e.target === wrap) { cleanup(); close(); } });
    wrap.querySelector('[data-act=cancel]').onclick = () => { cleanup(); close(); };
    wrap.querySelector('[data-act=ok]').onclick = () => { cleanup(); wrap.remove(); resolve(getVal()); };
  });
}

async function guard(fn, btn) {
  let t;
  if (btn) { btn.disabled = true; t = btn.textContent; btn.textContent = '处理中…'; }
  try { await fn(); await load(); }
  catch (e) { toast(e.message, true); }
  finally { if (btn) { btn.disabled = false; btn.textContent = t; } }
}

/* ---------- 渲染 ---------- */
async function loadLogs(page) {
  try {
    const r = await api(`/api/logs?page=${page}&pageSize=20`);
    DATA.logs = r.logs;
    DATA.logPage = r.page;
    DATA.logTotal = r.total;
    DATA.logTotalPages = r.totalPages;
    // 拉取保留天数配置（仅在尚未加载时，避免翻页反复请求）
    if (DATA.logRetDays === undefined) {
      try {
        const ret = await api('/api/logs/retention');
        DATA.logRetDays = ret.days;
      } catch (_) { DATA.logRetDays = 30; }
    }
  } catch (e) {
    toast(e.message, true);
  }
}

function render() {
  $('#tabs').innerHTML = TABS.map(([k, label]) => `<button class="${k === TAB ? 'on' : ''}" data-tab="${k}">${label}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach((b) => (b.onclick = () => { TAB = b.dataset.tab; render(); }));
  $('#app').innerHTML = { overview: viewOverview, machines: viewMachines, groups: viewGroups, domains: viewDomains, creds: viewCreds, logs: viewLogs }[TAB]();
  bind();
  if (TAB === 'logs' && !DATA.logPage) loadLogs(DATA.logPage || 1).then(render);
}

function bind() {
  document.querySelectorAll('[data-act]').forEach((el) => {
    const act = el.dataset.act;
    if (handlers[act]) el.onclick = () => handlers[act](el.dataset.id, el);
  });
}

/* ---------- DNS 凭据：一步式弹窗（选厂商即切换字段） ---------- */
function credModal(existing) {
  return new Promise((resolve) => {
    const providers = META.providers || [];
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${existing ? '编辑凭据' : '新增 DNS 凭据'}</h3>
      ${providers.length ? '' : '<div class="tag warn" style="margin-bottom:10px">厂商列表加载失败，请刷新页面后重试</div>'}
      <div class="fld"><label>凭据名称</label>
        <input data-k="name" value="${esc(existing?.name || '')}" placeholder="如 CF-主账号 / 阿里云-解析专用" /></div>
      <div class="fld"><label>DNS 厂商</label>
        <select data-k="provider">${providers.map((p) => `<option value="${esc(p.key)}" ${existing?.provider === p.key ? 'selected' : ''}>${esc(p.label)}</option>`).join('')}</select></div>
      <div id="cred-fields"></div>
      <div id="cred-docs"></div>
      <div class="row" style="justify-content:flex-end;margin-top:6px">
        <button class="btn" data-a="cancel">取消</button>
        <button class="btn primary" data-a="ok">保存</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const close = (v) => { wrap.remove(); resolve(v); };

    const renderDocs = (key) => {
      const p = providers.find((x) => x.key === key);
      const d = p?.docs || {};
      const steps = d.steps || [];
      const box = wrap.querySelector('#cred-docs');
      if (!d.title && !steps.length) { box.innerHTML = ''; return; }
      box.innerHTML = `<div class="cred-docs">
        <div class="cred-docs-title">📖 ${esc(d.title)}</div>
        <ol>${steps.map((s) => `<li>${esc(s)}</li>`).join('')}</ol>
        ${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">前往获取（新窗口打开）↗</a>` : ''}
      </div>`;
    };

    const renderFields = () => {
      const key = wrap.querySelector('[data-k=provider]').value;
      const p = providers.find((x) => x.key === key);
      const cfg = existing ? safeJson(existing.config) : {};
      const fs = p?.fields || [];
      wrap.querySelector('#cred-fields').innerHTML = (fs.length ? fs.map((f) => `
        <div class="fld"><label>${esc(f.label)}</label>
          <input type="${f.secret ? 'password' : 'text'}" data-f="${esc(f.key)}" value="${esc(cfg[f.key] || '')}" autocomplete="off" />
          ${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`).join('')
        : '<div class="muted" style="font-size:12px">该厂商无需密钥（演练模式：只计算排班、写日志，不下发解析）。</div>');
      renderDocs(key);
    };
    renderFields();
    wrap.querySelector('[data-k=provider]').onchange = renderFields;
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(null); });
    wrap.querySelector('[data-a=cancel]').onclick = () => close(null);
    wrap.querySelector('[data-a=ok]').onclick = () => {
      const name = wrap.querySelector('[data-k=name]').value.trim();
      const provider = wrap.querySelector('[data-k=provider]').value;
      if (!name) return toast('请填写凭据名称', true);
      if (!provider) return toast('请选择 DNS 厂商', true);
      const config = {};
      wrap.querySelectorAll('[data-f]').forEach((el) => { config[el.dataset.f] = el.value.trim(); });
      close({ name, provider, config });
    };
  });
}

      });
      close();
      await guard(async () => api(`/api/groups/${id}/members`, { method: 'PUT', body: { items } }));
    };
  }),

  'preview-group': (id) => guard(async () => {
    const r = await api('/api/preview?group_id=' + id);
    const p = (r.preview || [])[0];
    if (!p) return toast('预览失败：分组不存在', true);
    const isWindow = p.mode === 'window';
    const head = isWindow
      ? '<tr><th>日期</th><th>当天时段值班安排</th><th>此刻命中</th></tr>'
      : '<tr><th>日期</th><th>值班机器</th><th>解析 IP</th><th>判定依据</th></tr>';
    const body = p.plan.map((d) => isWindow
      ? `<tr><td>${esc(d.date)}</td><td>${esc(d.schedule || '—')}</td><td>${d.machine ? `<strong>${esc(d.machine)}</strong>` : '<span class="tag warn">无</span>'}</td></tr>`
      : `<tr><td>${esc(d.date)}</td><td>${d.machine ? `<strong>${esc(d.machine)}</strong>` : '<span class="tag warn">无</span>'}</td><td><code>${esc(d.ip || '—')}</code></td><td class="muted">${esc(d.reason)}</td></tr>`).join('');
    const note = isWindow
      ? '<div class="hint muted" style="margin-bottom:8px">按在线时段模式：一天内解析随各机器在线时段自动切换，下表列出每天的时段值班安排与「当前时刻」命中的机器。</div>'
      : '';
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>${esc(p.group)} · 未来 7 天排班预览</h3>
      <div class="hint muted" style="margin-bottom:8px">模式：${esc(MODE_LABELS[p.mode] || p.mode || '')} · 时区 ${esc(p.timezone)}</div>
      ${note}
      <table>${head}${body}</table>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act2="close">关闭</button></div></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('[data-act2=close]').onclick = () => wrap.remove();
    wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  }),

  'add-domain': (id) => guard(async () => {
    if (!DATA.groups.length) return toast('请先创建分组', true);
    const v = await modal('新增解析记录', domainFields(), { group_id: id || '', record_name: '@', record_type: 'A', ttl: 600, enabled: true, proxied: false });
    if (v) await api('/api/domains', { method: 'POST', body: v });
  }),
  'edit-domain': (id) => guard(async () => {
    const r = DATA.groups.flatMap((g) => g.records).find((x) => String(x.id) === String(id));
    const v = await modal('编辑解析记录', domainFields(), { ...r, enabled: !!r.enabled, proxied: !!r.proxied });
    if (v) await api('/api/domains/' + id, { method: 'PUT', body: v });
  }),
  'del-domain': (id) => guard(async () => { if (confirm('删除该解析记录？')) await api('/api/domains/' + id, { method: 'DELETE' }); }),
  'test-domain': (id, el) => guard(async () => {
    const r = await api('/api/domains/' + id + '/test', { method: 'POST' });
    const rows = [
      ['分组', r.group || '—'],
      ['记录', r.domain || '—'],
      ['值班机器', r.machine ? r.machine : '无（使用兜底 IP）'],
      ['下发 IP', r.ip || '（无可用 IP）'],
      ['判定依据', r.reason || '—'],
      ['操作方式', r.action === 'created' ? '新建记录' : r.action === 'updated' ? '更新现有记录' : '—'],
      ['记录 ID', r.recordId || '（未回填）'],
      ['结果', (r.ok ? '✓ ' : '✗ ') + (r.message || (r.ok ? '已下发' : '失败'))],
    ];
    if (r.detail) {
      rows.push(
        ['[诊断] zone', r.detail.zone || '—'],
        ['[诊断] 匹配主机名', r.detail.hostName || '—'],
        ['[诊断] 拉到记录数', r.detail.recordsTotal ?? '—'],
        ['[诊断] 命中记录', r.detail.matchedId ? `${r.detail.matchedId}（原值 ${r.detail.matchedAnswer || '空'}）` : '未命中（走新建）'],
        ['[诊断] 回读值', r.detail.verifyAnswer ?? '—'],
      );
    }
    const wrap = document.createElement('div');
    wrap.className = 'modal';
    wrap.innerHTML = `<div class="modal-box"><h3>解析下发结果</h3>
      <table>${rows.map(([k, v]) => `<tr><td class="muted" style="width:100px">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>
      <div class="hint muted" style="margin-top:10px">「下发」会按当前排班把值班机器的 IP <strong>强制写入这一条 DNS 记录</strong>（等价于针对单条的「同步本组」）。DNS 生效还需等待 TTL；若下发失败请检查凭据与域名配置。</div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-act2="close">关闭</button></div></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector('[data-act2=close]').onclick = () => wrap.remove();
    wrap.addEventListener('click', (e) => { if (e.target === wrap) wrap.remove(); });
  }, el),

  'add-cred': () => guard(async () => {
    const v = await credModal(null);
    if (v) await api('/api/credentials', { method: 'POST', body: v });
  }),
  'edit-cred': (id) => guard(async () => {
    const c = (await api('/api/credentials')).credentials.find((x) => String(x.id) === String(id));
    if (!c) return;
    const v = await credModal(c);
    if (v) await api('/api/credentials/' + id, { method: 'PUT', body: v });
  }),
  'del-cred': (id) => guard(async () => { if (confirm('删除该凭据？（被解析记录引用时会被拒绝）')) await api('/api/credentials/' + id, { method: 'DELETE' }); }),
  'test-cred': (id) => guard(async () => {
    const v = await modal('凭据连通测试', [
      { key: 'domain', label: '域名', placeholder: 'example.com', hint: '用该凭据查询这条记录的当前解析值，验证密钥是否可用' },
      { key: 'record_name', label: '主机记录', placeholder: '@' },
      { key: 'zone_id', label: 'Zone ID（仅 Cloudflare，可选）' },
    ], { record_name: '@' });
    if (!v) return;
    const r = await api('/api/credentials/' + id + '/test', { method: 'POST', body: v });
    toast('✓ 密钥可用：' + (r.recordId ? '记录已存在，' : '记录尚未创建，') + '当前值=' + (r.content || '空'));
  }),

  'sync-group': (id, el) => guard(async () => {
    const r = await api('/api/sync', { method: 'POST', body: { group_id: Number(id), force: true } });
    const msg = (r.results?.[0]?.results || []).map((x) => x.domain + '：' + x.message).join('；');
    toast(msg || '完成');
  }, el),

  'clear-logs': async (id, el) => {
    if (!confirm('清空全部日志？')) return;
    if (el) el.disabled = true;
    try {
      await api('/api/logs/clear', { method: 'POST' });
      await loadLogs(1);
      render();
    } catch (e) { toast(e.message, true); }
    finally { if (el) el.disabled = false; }
  },
  'save-retention': async (id, el) => {
    const inp = $('#log-ret-days');
    const v = inp ? inp.value.trim() : '';
    const n = Number(v);
    if (v === '' || !Number.isInteger(n) || n < 0) { toast('保留天数须为 ≥0 的整数（0=关闭自动清理）', true); return; }
    if (el) el.disabled = true;
    try {
      await api('/api/logs/retention', { method: 'POST', body: { days: n } });
      DATA.logRetDays = n;
      toast(n === 0 ? '已关闭自动清理' : `已设置：保留 ${n} 天，超期日志将由定时任务自动删除`);
    } catch (e) { toast(e.message, true); }
    finally { if (el) el.disabled = false; }
  },
  // 注意：日志分页自管数据，不能用 guard()——guard 末尾的 load() 会用 overview 整体覆盖 DATA，
  // 清掉 DATA.logPage，导致 render() 自动 loadLogs(1) 把页面拉回第一页。
  'log-prev': async (id, el) => {
    const p = Math.max(1, (DATA.logPage || 1) - 1);
    if (el) el.disabled = true;
    try { await loadLogs(p); render(); }
    catch (e) { toast(e.message, true); }
    finally { if (el) el.disabled = false; }
  },
  'log-next': async (id, el) => {
    const p = Math.min(DATA.logTotalPages || 1, (DATA.logPage || 1) + 1);
    if (el) el.disabled = true;
    try { await loadLogs(p); render(); }
    catch (e) { toast(e.message, true); }
    finally { if (el) el.disabled = false; }
  },
};

function groupFields() {
  return [
    { key: 'name', label: '分组名称', placeholder: '如 游戏服-A组' },
    { key: 'mode', label: '排班模式', type: 'select', options: (META.modes || []).map((m) => ({ value: m.key, label: m.label || m.key })) },
    { key: 'timezone', label: '时区', type: 'select', options: META.timezones },
    { key: 'switch_time', label: '每日切换时刻', placeholder: '03:00', hint: '切换时刻之前仍沿用前一天的值班机器', showIf: (v) => v.mode === 'rotate' },
    { key: 'anchor_date', label: '轮转基准日', placeholder: '1970-01-01', hint: '轮换从该日起算（1970-01-01 表示从组内第 1 台开始），一般不用改', showIf: (v) => v.mode === 'rotate' },
    { key: 'fallback_ip', label: '兜底 IP（可选）', placeholder: '所有机器都不在线时解析到这里', hint: '留空则无机器在线时保持上一次解析不变' },
    { key: 'enabled', label: '启用', type: 'checkbox' },
  ];
}

function domainFields() {
  const credOpts = DATA.credentials.map((c) => ({ value: c.id, label: c.name + '（' + c.provider + '）' }));
  if (!credOpts.length) credOpts.unshift({ value: '', label: '（还没有凭据，请先到「DNS 凭据」新建）' });
  return [
    { key: 'group_id', label: '所属分组', type: 'select', options: DATA.groups.map((g) => ({ value: g.id, label: g.name })) },
    { key: 'provider', label: 'DNS 厂商', type: 'select', options: (META.providers || []).map((p) => ({ value: p.key, label: p.label })) },
    { key: 'credential_id', label: '使用的凭据', type: 'select', options: credOpts, hint: DATA.credentials.length ? '' : '需要先在「DNS 凭据」页新建一条凭据' },
    { key: 'domain', label: '域名（填注册的根域名）', placeholder: 'example.com',
      hint: '填你在 DNS 厂商注册的域名本身；子域（如 ddns1）填到「主机记录」。误填完整子域会自动帮你拆分',
      onChange: (v, wrap) => {
        const d = String(v.domain || '').trim().toLowerCase();
        const parts = d.split('.');
        const rnEl = wrap.querySelector('[data-k="record_name"]');
        const dEl = wrap.querySelector('[data-k="domain"]');
        if (parts.length > 2 && rnEl && (!rnEl.value || rnEl.value === '@')) {
          rnEl.value = parts[0];
          dEl.value = parts.slice(1).join('.');
          toast('已自动拆分：域名 → ' + parts.slice(1).join('.') + '，主机记录 → ' + parts[0]);
        }
      } },
    { key: 'record_name', label: '主机记录', placeholder: '@ 或 www', hint: '@ 表示根域名本身' },
    { key: 'ttl', label: 'TTL（秒）', type: 'number', hint: '越小生效越快；建议 60~600。Cloudflare 橙云代理时固定为 auto' },
    { key: 'proxied', label: 'Cloudflare 橙云代理（仅 Cloudflare 厂商）', type: 'checkbox' },
    { key: 'record_id', label: '记录 ID（可选）', hint: '留空自动查询并回填' },
    { key: 'zone_id', label: 'Zone ID（仅 Cloudflare，可选）', hint: '留空自动查询并回填' },
    { key: 'enabled', label: '启用', type: 'checkbox' },
  ];
}

$('#btn-login').onclick = doLogin;
$('#login-token').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('#btn-logout').onclick = () => logout(true);
$('#btn-reload').onclick = load;
$('#btn-sync').onclick = (e) => guard(async () => {
  const r = await api('/api/sync', { method: 'POST', body: {} });
  toast('同步完成，共 ' + r.results.length + ' 个分组');
}, e.currentTarget);
$('#btn-force').onclick = (e) => guard(async () => {
  await api('/api/sync', { method: 'POST', body: { force: true } });
  toast('已强制重新下发全部解析');
}, e.currentTarget);

/* ---------- 主题切换 ---------- */
const THEME_KEY = 'dr_theme';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const isLight = theme === 'light';
  const btn = $('#btn-theme');
  if (btn) btn.textContent = isLight ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}
$('#btn-theme').onclick = toggleTheme;

// 启动：有令牌则尝试直接进入，否则显示登录页
(function init() {
  // 主题：优先用户手动选择，其次跟随系统偏好，默认深色
  const saved = localStorage.getItem(THEME_KEY);
  const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (sysDark ? 'dark' : 'light'));
  if (TOKEN) {
    doLogin();
  } else {
    showLogin();
  }
})();
</script>
</body>
