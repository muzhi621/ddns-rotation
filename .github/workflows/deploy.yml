name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: 排班算法 & API 自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    name: 部署
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: 校验必需 Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          missing=()
          [ -z "$CF_TOKEN" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "$D1_ID" ] && missing+=(D1_DATABASE_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::仓库缺少 Secrets: ${missing[*]} —— 请在 Settings → Secrets and variables → Actions 中添加后重新运行"
            exit 1
          fi
          if [ -z "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "::warning::未设置 ADMIN_TOKEN，部署后管理后台将不做鉴权（任何人可改解析），强烈建议配置"
          fi

      - name: 诊断 Cloudflare 凭据与账号
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          S=$GITHUB_STEP_SUMMARY
          echo "### 🔍 Cloudflare 凭据诊断" >> "$S"

          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$code" != "200" ]; then
            echo "::error::CF API Token 无效（HTTP $code）。请到 Cloudflare → My Profile → API Tokens，用模板 'Edit Cloudflare Workers' 重建后更新 Secret"
            echo "- ❌ API Token 校验失败（HTTP $code）" >> "$S"
            exit 1
          fi
          echo "- ✅ API Token 有效" >> "$S"

          curl -s https://api.cloudflare.com/client/v4/accounts \
            -H "Authorization: Bearer $CF_TOKEN" -o /tmp/accounts.json
          cnt=$(python3 -c "import json;print(len(json.load(open('/tmp/accounts.json')).get('result',[])))")
          echo "- 该 Token 可访问账号数：**$cnt**" >> "$S"

          acc="${CF_ACC:-}"
          if [ -z "$acc" ]; then
            acc=$(python3 -c "import json;r=json.load(open('/tmp/accounts.json')).get('result',[]);print(r[0]['id'] if r else '')")
            echo "::warning::未设置 CLOUDFLARE_ACCOUNT_ID，已自动选用第一个账号 $acc；若不是你要的账号，请手动添加该 Secret"
            echo "- ⚠️ 未设置 \`CLOUDFLARE_ACCOUNT_ID\`，自动选用第一个账号" >> "$S"
          else
            echo "- 使用 Secret 中的账号：\`$acc\`" >> "$S"
          fi
          if [ -z "$acc" ]; then
            echo "::error::该 Token 看不到任何账号，无法部署。请用 'Edit Cloudflare Workers' 模板重建 Token"
            exit 1
          fi
          echo "account_id=$acc" >> "$GITHUB_OUTPUT"

          found=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$acc/d1/database" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; print(next((x['uuid'] for x in json.load(sys.stdin).get('result',[]) if x.get('name')=='ddns-rotation'), ''))")
          if [ -z "$found" ]; then
            echo "::error::账号下找不到名为 ddns-rotation 的 D1 数据库。先执行 npx wrangler d1 create ddns-rotation，把返回的 UUID 存进 Secret D1_DATABASE_ID"
            echo "- ❌ 未找到 D1 数据库 \`ddns-rotation\`" >> "$S"
            exit 1
          fi
          echo "- ✅ D1 数据库 \`ddns-rotation\` 已就绪" >> "$S"
          cp "$S" /tmp/summary.md 2>/dev/null || true

      - name: 注入 D1 database_id
        run: sed -i "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${{ secrets.D1_DATABASE_ID }}|" wrangler.toml

      - name: 初始化 / 迁移数据库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: npx wrangler d1 execute ddns-rotation --remote --file=./schema.sql --yes

      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee /tmp/deploy.log; then
            echo "### ❌ 部署失败（wrangler 输出末尾 60 行）" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -E 's/[A-Za-z0-9_-]{35,}/[REDACTED]/g' /tmp/deploy.log | tail -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::部署失败，见 Summary 中的 wrangler 输出"
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$url" ] && echo "- 🌐 Worker 地址：$url" >> $GITHUB_STEP_SUMMARY

      - name: 注入 ADMIN_TOKEN（Worker Secret）
        if: ${{ secrets.ADMIN_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      - name: 失败归因
        if: failure()
        run: |
          if [ -f /tmp/deploy.log ]; then
            if grep -qiE '403|permission|not authorized|authentication error|insufficient' /tmp/deploy.log; then
              echo "::error::大概率是 API Token 权限不足 —— 需要 Account → Workers Scripts: Edit + D1: Edit。请用官方模板 'Edit Cloudflare Workers' 重建 Token"
            elif grep -qiE 'more than one account|select an account' /tmp/deploy.log; then
              echo "::error::Token 下有多个账号，请添加 Secret CLOUDFLARE_ACCOUNT_ID"
            elif grep -qiE 'already exists' /tmp/deploy.log; then
              echo "::error::同名 Worker 已存在（可能是 Workers Builds 创建的），改名或删除旧的再部署"
            fi
          fi

      # 失败时把脱敏日志打包，交给下一个 job 开成 Issue，便于快速定位
      - name: 收集诊断报告
        if: failure()
        run: |
          {
            echo "## Actions 运行 #${{ github.run_number }}"
            echo "commit: \`${GITHUB_SHA:0:7}\` · 分支 \`${GITHUB_REF_NAME}\`"
            echo
            cat /tmp/summary.md 2>/dev/null || true
            echo
            echo "### wrangler deploy 输出（末尾 80 行，已脱敏）"
            echo '```'
            sed -E 's/[A-Za-z0-9_-]{35,}/[REDACTED]/g' /tmp/deploy.log 2>/dev/null | tail -80 || echo "(无 deploy 日志，失败发生在更早的步骤)"
            echo '```'
          } > report.md

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-diagnostics
          path: report.md

  report:
    name: 上报诊断到 Issue
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 探测 deploy job 结果
        run: |
          echo "deploy 结论：${{ needs.deploy.result }}"

      - uses: actions/download-artifact@v4
        with:
          name: deploy-diagnostics
        continue-on-error: true

      - name: 写入 / 更新 Issue（纯 REST，不依赖 gh CLI）
        if: ${{ needs.deploy.result == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 若上面没下载到 artifact（失败太早），则现场拼一份结论摘要
          if [ ! -f report.md ]; then
            {
              echo "## Actions 运行 #${{ github.run_number }}"
              echo "commit: \`${GITHUB_SHA:0:7}\` · 分支 \`${GITHUB_REF_NAME}\`"
              echo
              echo "deploy job 结论：**${{ needs.deploy.result }}**"
              echo
              echo "> 失败发生得太早，未生成 artifact。请打开本运行页面查看步骤日志。"
            } > report.md
          fi
          n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/issues?state=open&labels=ci-log&per_page=1" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0]['number'] if d else '')")
          python3 -c "import json;open('/tmp/body.json','w').write(json.dumps({'body':open('report.md',encoding='utf-8').read()}))"
          if [ -n "$n" ]; then
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json "https://api.github.com/repos/$GH_REPO/issues/$n/comments" >/dev/null
            echo "已更新 Issue #$n"
          else
            python3 -c "import json;open('/tmp/body.json','w').write(json.dumps({'title':'[CI] 部署失败诊断（自动）','body':open('report.md',encoding='utf-8').read(),'labels':['ci-log']}))"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/body.json "https://api.github.com/repos/$GH_REPO/issues" >/dev/null
            echo "已创建 Issue"
          fi
