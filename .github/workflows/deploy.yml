name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 排班算法 & API 自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    name: 部署
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: 校验必需 Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          missing=()
          [ -z "$CF_TOKEN" ] && missing+=(CLOUDFLARE_API_TOKEN)
          [ -z "$D1_ID" ] && missing+=(D1_DATABASE_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::仓库缺少 Secrets: ${missing[*]} —— 请在 Settings → Secrets and variables → Actions 中添加后重新运行"
            exit 1
          fi
          if [ -z "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "::warning::未设置 ADMIN_TOKEN，部署后管理后台将不做鉴权（任何人可改解析），强烈建议配置"
          fi

      # 直接在 CI 里问 Cloudflare：token 有效吗？能看几个账号？D1 在不在？结果写进 Job Summary
      - name: 诊断 Cloudflare 凭据与账号
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          S=$GITHUB_STEP_SUMMARY
          echo "### 🔍 Cloudflare 凭据诊断" >> "$S"

          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CF_TOKEN")
          if [ "$code" != "200" ]; then
            echo "::error::CF API Token 无效（HTTP $code）。请到 Cloudflare → My Profile → API Tokens，用模板 'Edit Cloudflare Workers' 重建后更新 Secret"
            echo "- ❌ API Token 校验失败（HTTP $code）" >> "$S"
            exit 1
          fi
          echo "- ✅ API Token 有效" >> "$S"

          curl -s https://api.cloudflare.com/client/v4/accounts \
            -H "Authorization: Bearer $CF_TOKEN" -o /tmp/accounts.json
          cnt=$(python3 -c "import json;print(len(json.load(open('/tmp/accounts.json')).get('result',[])))")
          echo "- 该 Token 可访问账号数：**$cnt**" >> "$S"

          acc="${CF_ACC:-}"
          if [ -z "$acc" ]; then
            acc=$(python3 -c "import json;r=json.load(open('/tmp/accounts.json')).get('result',[]);print(r[0]['id'] if r else '')")
            echo "::warning::未设置 CLOUDFLARE_ACCOUNT_ID，已自动选用第一个账号 $acc；若不是你要的账号，请手动添加该 Secret"
            echo "- ⚠️ 未设置 \`CLOUDFLARE_ACCOUNT_ID\`，自动选用：**$acc**" >> "$S"
          else
            echo "- 使用 Secret 中的账号：**$acc**" >> "$S"
          fi
          if [ -z "$acc" ]; then
            echo "::error::该 Token 看不到任何账号，无法部署。请用 'Edit Cloudflare Workers' 模板重建 Token"
            exit 1
          fi
          echo "account_id=$acc" >> "$GITHUB_OUTPUT"

          found=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$acc/d1/database" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -c "import json,sys; print(next((x['uuid'] for x in json.load(sys.stdin).get('result',[]) if x.get('name')=='ddns-rotation'), ''))")
          if [ -z "$found" ]; then
            echo "::error::账号 $acc 下找不到名为 ddns-rotation 的 D1 数据库。先执行 npx wrangler d1 create ddns-rotation，把返回的 UUID 存进 Secret D1_DATABASE_ID"
            echo "- ❌ 未找到 D1 数据库 \`ddns-rotation\`" >> "$S"
            exit 1
          fi
          echo "- ✅ D1 数据库 \`ddns-rotation\` → \`$found\`" >> "$S"

      - name: 注入 D1 database_id
        run: |
          sed -i "s|REPLACE_WITH_YOUR_D1_DATABASE_ID|${{ secrets.D1_DATABASE_ID }}|" wrangler.toml
          grep database_id wrangler.toml

      - name: 初始化 / 迁移数据库
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: npx wrangler d1 execute ddns-rotation --remote --file=./schema.sql --yes

      # 失败时把 wrangler 输出脱敏后写进 Summary，避免再去翻日志
      - name: 部署 Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee /tmp/deploy.log; then
            echo "### ❌ 部署失败（wrangler 输出末尾 60 行）" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            sed -E 's/[A-Za-z0-9_-]{40,}/[REDACTED]/g' /tmp/deploy.log | tail -60 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "::error::部署失败，见 Summary 中的 wrangler 输出" 
            exit 1
          fi
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          [ -n "$url" ] && echo "- 🌐 Worker 地址：$url" >> $GITHUB_STEP_SUMMARY

      # 部署完成后再注入，此时 Worker 已存在
      - name: 注入 ADMIN_TOKEN（Worker Secret）
        if: ${{ secrets.ADMIN_TOKEN != '' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
        run: echo "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      - name: 失败归因
        if: failure()
        run: |
          if [ -f /tmp/deploy.log ]; then
            if grep -qiE '403|permission|not authorized|authentication error|insufficient' /tmp/deploy.log; then
              echo "::error::大概率是 API Token 权限不足 —— 需要 Account → Workers Scripts: Edit + D1: Edit。请用官方模板 'Edit Cloudflare Workers' 重建 Token 并更新 Secret"
            elif grep -qiE 'more than one account|select an account' /tmp/deploy.log; then
              echo "::error::Token 下有多个账号，请添加 Secret CLOUDFLARE_ACCOUNT_ID（Workers 概览页右侧可复制）"
            elif grep -qiE 'script.*already exists|name.*already' /tmp/deploy.log; then
              echo "::error::同名 Worker 已存在（可能是 Workers Builds 创建的），换个名字或删掉旧的再部署"
            fi
          fi

      - name: 部署结果提示
        if: always()
        run: |
          if [ -z "${{ secrets.ADMIN_TOKEN }}" ]; then
            echo "::warning::未配置 ADMIN_TOKEN，管理后台当前不鉴权，请尽快添加该 Secret 并重跑"
          else
            echo "ADMIN_TOKEN 已注入。Worker 地址见 Summary 或上方部署日志"
          fi
